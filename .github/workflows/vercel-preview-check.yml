name: Vercel preview route check
on:
  pull_request:
    branches: [main]
    paths:
      - 'vercel.json'
      - 'vite.config.ts'
      - 'app/public/kitchen-os-demo/**'
      - '.github/workflows/vercel-preview-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vite build --base=/
      - name: Verify Vercel root build and dedicated concept demo
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,existsSync} from 'node:fs';
          const html=readFileSync('dist/index.html','utf8');
          const demo='dist/kitchen-os-demo/index.html';
          if(!existsSync(demo)) throw new Error('Kitchen OS preview not copied to dist');
          const concept=readFileSync(demo,'utf8');
          if(!concept.includes('HomeCraft Kitchen OS')) throw new Error('Unexpected concept page');
          if(!html.includes('/assets/')) throw new Error('Vercel root asset URLs missing');
          if(html.includes('/HomeCraft/assets/')) throw new Error('GitHub Pages base leaked into Vercel build');
          console.log('PASS: root Vercel assets and /kitchen-os-demo/index.html');
          JS
